---
# keycloak-truststore ConfigMap is NOT defined here.
# It is created during setup after the TLS cert is generated.
# See setup.kube.md — Phase 1 step 8: "Create keycloak-truststore ConfigMap"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
        - name: wait-for-postgres
          image: pafhbr01.paf.com/paf-ai-infra-repo/busybox:latest
          command:
            - sh
            - -c
            - |
              until nc -z pgcluster-rw.pgdb.svc.cluster.local 5432; do
                echo "waiting for postgres..."; sleep 2
              done
      containers:
        - name: keycloak
          image: pafhbr01.paf.com/paf-ai-infra-repo/keycloak/keycloak:26.5.4
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://pgcluster-rw.pgdb.svc.cluster.local/keycloak
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-cred
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-cred
                  key: password
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: admin
            - name: KC_HOSTNAME
              value: "http://keycloak.maas.paf.com"
            - name: KC_HOSTNAME_URL
              value: "http://keycloak.maas.paf.com"
            - name: KC_HOSTNAME_PORT
              value: "-1"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1024m"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: truststore
              mountPath: /opt/keycloak/truststore
              readOnly: true
      volumes:
        - name: truststore
          configMap:
            name: keycloak-truststore
            optional: true

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/proxy-set-headers: "X-Forwarded-For $proxy_add_x_forwarded_for"
spec:
  ingressClassName: nginx
  rules:
    - host: keycloak.maas.paf.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
