version: "3.9"

services:

  samba-dc:
    image: instantlinux/samba-dc:latest
    cap_add:
      - CAP_SYS_ADMIN
    environment:
      DOMAIN_ACTION: ${SAMBA_DOMAIN_ACTION:-start}
      # DOMAIN_ACTION: provision
      REALM: ${SAMBA_REALM:-ad.example.com}
    volumes:
      - etc:/etc/samba
      - lib:/var/lib/samba
    secrets:
      - samba-admin-password
    ports:
      - "389:389"
      - "636:636"

  postgres:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_MULTIPLE_DATABASES: litellm,bifrost
    volumes:
      - kc_db:/var/lib/postgresql/data
      - ./scripts/pg_multiple_databases.sh:/docker-entrypoint-initdb.d/pg_multiple_databases.sh
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.4
    container_name: keycloak
    command: start-dev --import-realm
    depends_on:
      - postgres
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_HOSTNAME: "localhost"
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_TRUSTSTORE_PATHS: /opt/keycloak/truststore/samba-ca.pem

      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak-trust:/opt/keycloak/truststore
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:v1.83.14-stable.patch.1
    container_name: litellm
    command: ["--config", "/app/config.yaml"]
    depends_on:
      - postgres
      - keycloak
      - ollama
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
      - ./litellm-image-patches/litellm/proxy/auth/auth_utils.py:/app/litellm/proxy/auth/auth_utils.py
      - ./litellm-image-patches/litellm/proxy/management_endpoints/ui_sso.py:/app/litellm/proxy/management_endpoints/ui_sso.py
      # LiteLLM Enterprise path differs across images; mount to both common locations.
      - ./litellm-image-patches/litellm_enterprise/proxy/management_endpoints/internal_user_endpoints.py:/app/enterprise/litellm_enterprise/proxy/management_endpoints/internal_user_endpoints.py
      - ./litellm-image-patches/litellm_enterprise/proxy/management_endpoints/internal_user_endpoints.py:/app/litellm_enterprise/proxy/management_endpoints/internal_user_endpoints.py
    environment:
      LITELLM_LOG: "INFO"
      LITELLM_MASTER_KEY: "sk-1234"
      UI_USERNAME: admin
      UI_PASSWORD: admin123
      PYTHONPATH: "/app:/app/enterprise"
      DATABASE_URL: postgresql://keycloak:keycloak@postgres/litellm
      PROXY_BASE_URL: "http://localhost:4000"
      GENERIC_CLIENT_ID: "litellmclient"
      GENERIC_CLIENT_SECRET: "xLYzlSDjDlxXCHBEo7SplV4wQkIfsODC"
      GENERIC_AUTHORIZATION_ENDPOINT: "http://localhost:8080/realms/master/protocol/openid-connect/auth"
      GENERIC_TOKEN_ENDPOINT: "http://host.docker.internal:8080/realms/master/protocol/openid-connect/token"
      GENERIC_USERINFO_ENDPOINT: "http://host.docker.internal:8080/realms/master/protocol/openid-connect/userinfo"
      GENERIC_REDIRECT_URI: "http://localhost:4000/sso/callback"
      LITELLM_FREE_SSO_USER_LIMIT: "0"
      STORE_MODEL_IN_DB: "True"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  bifrost:
    image: aicoemaas/bifrost:v1.5.0-sso-topup
    build:
      context: .
      dockerfile: bifrost-image-patches/Dockerfile
      args:
        BIFROST_BASE_IMAGE: maximhq/bifrost:v1.5.0
        VERSION: 1.5.0-sso-topup
    container_name: bifrost
    depends_on:
      - postgres
      - keycloak
      - ollama
    ports:
      - "4001:8080"
    volumes:
      - bifrost_data:/app/data
      - ./bifrost_config.json:/app/data/config.json:ro
    environment:
      APP_PORT: "8080"
      APP_HOST: "0.0.0.0"
      LOG_LEVEL: "info"
      LOG_STYLE: "json"
      BIFROST_ADMIN_USERNAME: admin
      BIFROST_ADMIN_PASSWORD: admin123
      BIFROST_SSO_ENABLED: "true"
      BIFROST_SSO_CLIENT_ID: "bifrostclient"
      BIFROST_SSO_CLIENT_SECRET: "bifrost-secret"
      BIFROST_SSO_AUTHORIZATION_ENDPOINT: "http://localhost:8080/realms/master/protocol/openid-connect/auth"
      BIFROST_SSO_TOKEN_ENDPOINT: "http://host.docker.internal:8080/realms/master/protocol/openid-connect/token"
      BIFROST_SSO_USERINFO_ENDPOINT: "http://host.docker.internal:8080/realms/master/protocol/openid-connect/userinfo"
      BIFROST_SSO_REDIRECT_URI: "http://localhost:4001/api/session/sso/callback"
      BIFROST_SSO_SCOPES: "openid email profile"
      BIFROST_SSO_LOGIN_REDIRECT: "/workspace"
      BIFROST_KEYCLOAK_ADMIN_BASE_URL: "http://host.docker.internal:8080"
      BIFROST_KEYCLOAK_REALM: "master"
      BIFROST_KEYCLOAK_ADMIN_USERNAME: admin
      BIFROST_KEYCLOAK_ADMIN_PASSWORD: admin
      OLLAMA_URL: "http://ollama:11434"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  kc_db:
  samba_data:
  etc:
  lib:
  ollama_data:
  bifrost_data:

secrets:
  samba-admin-password:
    file: ./secrets.yaml
