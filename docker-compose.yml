version: "3.9"

services:

  samba-dc:
    image: instantlinux/samba-dc:latest
    cap_add:
      - CAP_SYS_ADMIN
    environment:
      DOMAIN_ACTION: provision
      REALM: ${SAMBA_REALM:-ad.example.com}
    volumes:
      - etc:/etc/samba
      - lib:/var/lib/samba
    secrets:
      - samba-admin-password
    ports:
      - "389:389"
      - "636:636"

  postgres:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - kc_db:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.4
    container_name: keycloak
    command: start-dev --import-realm
    depends_on:
      - postgres
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_TRUSTSTORE_PATHS: /opt/keycloak/truststore/samba-ca.pem

      JAVA_OPTS: "-Xms512m -Xmx1024m"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak-trust:/opt/keycloak/truststore
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    command: ["--config", "/app/config.yaml"]
    depends_on:
      - keycloak
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      LITELLM_LOG: "INFO"
    restart: unless-stopped

volumes:
  kc_db:
  samba_data:
  etc:
  lib:

secrets:
  samba-admin-password:
    file: ./secrets.yaml