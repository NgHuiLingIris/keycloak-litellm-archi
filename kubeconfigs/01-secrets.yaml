---
# Samba AD administrator password — mounted as file at /run/secrets/samba-admin-password
apiVersion: v1
kind: Secret
metadata:
  name: samba-admin-password
  namespace: keycloak
type: Opaque
stringData:
  samba-admin-password: "Admin1234!"

---
# LiteLLM SSO credentials
# GENERIC_CLIENT_SECRET must be updated after creating the OIDC client in Keycloak.
# See setup.kube.md — "Update litellm-sso Secret" section.
apiVersion: v1
kind: Secret
metadata:
  name: litellm-sso
  namespace: keycloak
type: Opaque
stringData:
  LITELLM_MASTER_KEY: "sk-1234"
  GENERIC_CLIENT_SECRET: "REPLACE_WITH_KEYCLOAK_CLIENT_SECRET"
